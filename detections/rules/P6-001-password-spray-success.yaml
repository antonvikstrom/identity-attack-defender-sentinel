id: P6-001
title: "Password spray followed by a successful sign-in"
status: draft
severity: high

goal: |
  Detects one source IP that fails to sign in as many different users
  (password spray) and then signs in successfully as at least one of them.
  A success after a spray means an account is probably compromised.

mitre:
  - tactic: "Credential Access"
    technique: "T1110.003"
  - tactic: "Initial Access"
    technique: "T1078.004"

data_sources:
  - table: "SigninLogs"
    connector: "Microsoft Entra ID"

schedule:
  frequency: 1h
  lookback: 1h

threshold:
  value: "4 or more different users failing from one IP, and at least 1 success"
  reason: |
    The lab has 5 test users, so a spray against all of them gives 5;
    4 leaves a small margin. In a real tenant, set it from a baseline of
    normal failures per IP (likely 10 or more), and exclude known shared
    IPs such as office NAT or VPN gateways.

query: |
  let min_failed_users = 4;
  SigninLogs
  | summarize
      FailedUsers    = dcountif(UserPrincipalName, ResultType == "50126"),
      FailedAttempts = countif(ResultType == "50126"),
      SuccessUsers   = make_set_if(UserPrincipalName, ResultType == "0"),
      FirstFailure   = minif(TimeGenerated, ResultType == "50126"),
      LastSuccess    = maxif(TimeGenerated, ResultType == "0"),
      FirstSeen      = min(TimeGenerated),
      LastSeen       = max(TimeGenerated)
      by IPAddress
  | where FailedUsers >= min_failed_users
      and array_length(SuccessUsers) > 0
      and LastSuccess > FirstFailure
  | mv-expand SuccessUser = SuccessUsers to typeof(string)

entities:
  - type: "Account"
    column: "SuccessUser"
  - type: "IP"
    column: "IPAddress"

blind_spots:
  - "Slow sprays spread over more than the 1h lookback (for example one attempt per hour)."
  - "Sprays rotated across many IPs, so no single IP reaches the threshold."
  - "Failures with other result codes than 50126 (for example locked accounts) are not counted."

false_positives:
  - "Shared IPs (office NAT, company VPN) where several users mistype their passwords in the same hour."

test:
  attack_step: "spray-then-success"
  expected_result: "One row: the attacker IP, FailedUsers 4 or more, SuccessUsers contains the compromised test user."

tuning_history:
  - date: 2026-10-20
    change: "Created. Tested against sample data in detections/tests/P6-001-test.kql."
  - date: 2026-10-20
    change: "Require a success after the first failure (LastSuccess > FirstFailure). Test case 203.0.113.77 (success before failures) no longer alerts."
  - date: 2026-11-27
    change: "One row per successful user (mv-expand SuccessUsers to SuccessUser), so Sentinel can map the Account entity. Test result unchanged: 1 row."